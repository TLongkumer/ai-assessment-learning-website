name: Restore reworked source to main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Restore reworked source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap2/archive.part* | tr -d '\n' | base64 -d > /tmp/ai-assessment-site.tar.gz
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/ai-assessment-site.tar.gz -C .
          find . -name '._*' -delete

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies and create lockfile
        run: npm install

      - name: Commit restored source
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Rework site from assessment prompt' || exit 0
          git push
